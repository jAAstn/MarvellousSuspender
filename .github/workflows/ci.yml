name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    name: Lint + locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint gate (blocks on NEW violations only)
        run: npm run lint:ci

      # check-locales currently fails on 16 locales waiting for a Crowdin sync
      # (11 missing keys each, plus uk-UA). Report but don't block until that lands;
      # flip this to a hard gate by removing the two lines below.
      - name: Locale completeness check (non-blocking)
        run: npm run check-locales
        continue-on-error: true
